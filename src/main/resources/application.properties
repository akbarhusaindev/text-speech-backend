# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}

spring.application.name=TextToSpeechProject


# =========================================================
# POSTGRESQL DATABASE
# =========================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/TxtToSpeech}
spring.datasource.username=${DB_USERNAME:akbarhusain}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# =========================================================
# GMAIL SMTP
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# =========================================================
# OPTIONAL HTTP EMAIL API (For cloud hosting where SMTP is blocked)
# =========================================================
mail.resend.api.key=${RESEND_API_KEY:}
mail.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}


# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000


# =========================================================
# MURF AI TEXT-TO-SPEECH
# =========================================================
murf.api.url=${MURF_API_URL:https://api.murf.ai/v1/speech/generate}
murf.api.key=${MURF_API_KEY:}
murf.voice.id=${MURF_VOICE_ID:en-US-alina}


# =========================================================
# BACKWARD COMPATIBILITY
# =========================================================
tts.api.url=${murf.api.url}
tts.api.key=${murf.api.key}
tts.voice.id=${murf.voice.id}


# =========================================================
# AUDIO STORAGE
# =========================================================
tts.audio.storage-path=${TTS_AUDIO_STORAGE_PATH:/tmp/audio/}


# =========================================================
# SWAGGER / OPENAPI
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs